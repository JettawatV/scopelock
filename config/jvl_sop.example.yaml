# DEMO TEMPLATE ONLY.
# Replace amounts/timelines with final confirmed JVL demo SOP values.
# Amounts below are illustrative USD demo values, not live pricing.

version: jvl-demo-v1

business:
  name: JVL
  currency: USD
  proposal_valid_days: 14
  default_quiet_window_minutes: 60

policies:
  human_approval_required_for_send: true
  accepted_scope_is_immutable: true
  ambiguous_commercial_change_requires_review: true

modules:
  - key: core_workflow_automation
    name: Core Workflow Automation
    description: Automate one defined business workflow from intake through structured output.
    aliases:
      - workflow automation
      - business process automation
      - request automation
    quantity:
      mode: fixed_package
      unit: workflow package
      minimum: 1
      maximum: 1
    pricing:
      type: fixed
      amount_usd: 4000
    timeline:
      base_days: 5
      parallelizable: false
    included:
      - one primary workflow
      - business-rule implementation
      - basic error handling
    excluded:
      - additional external integrations
      - custom mobile application
      - 24/7 managed operations
      - customer-facing AI response generation
    scope_rules:
      material_if_added: true

  - key: email_intake
    name: Gmail Intake Integration
    description: Read and process inbound Gmail messages for the workflow.
    aliases:
      - gmail integration
      - email intake
      - shared inbox
    quantity:
      mode: fixed_package
      unit: inbox package
      minimum: 1
      maximum: 1
    pricing:
      type: fixed
      amount_usd: 500
    timeline:
      base_days: 2
      parallelizable: true
    included:
      - one Gmail mailbox
      - inbound email parsing
    excluded:
      - multi-mailbox routing
    scope_rules:
      material_if_added: true

  - key: operations_dashboard
    name: Operations Dashboard
    description: Simple dashboard for structured workflow records and statuses.
    aliases:
      - dashboard
      - admin dashboard
      - operations view
    quantity:
      mode: fixed_package
      unit: dashboard package
      minimum: 1
      maximum: 1
    pricing:
      type: fixed
      amount_usd: 750
    timeline:
      base_days: 3
      parallelizable: true
    included:
      - standard charts
      - status table
      - basic filters
    excluded:
      - advanced BI modeling
      - custom mobile dashboard
    scope_rules:
      material_if_added: true

  - key: email_notifications
    name: Email Notification Workflow
    description: Email alerts for predefined workflow events.
    aliases:
      - email alerts
      - email notifications
    quantity:
      mode: fixed_package
      unit: notification package
      minimum: 1
      maximum: 1
    pricing:
      type: fixed
      amount_usd: 400
    timeline:
      base_days: 1
      parallelizable: true
    included:
      - predefined notification events
    excluded:
      - marketing campaigns
    scope_rules:
      material_if_added: true

  - key: line_notifications
    name: LINE Notification Integration
    description: Send workflow notifications through LINE.
    aliases:
      - line alerts
      - line notifications
      - line integration
      - whatsapp alerts
      - whatsapp notifications
      - whatsapp integration
    quantity:
      mode: fixed_package
      unit: notification package
      minimum: 1
      maximum: 1
    pricing:
      type: fixed
      amount_usd: 750
    timeline:
      base_days: 3
      parallelizable: false
    included:
      - one LINE channel/account
      - workflow notifications
    excluded:
      - LINE mini app
      - conversational chatbot
    scope_rules:
      material_if_added: true

  - key: line_approval
    name: LINE Approval Workflow
    description: Allow authorized managers to approve/reject workflow items through LINE.
    aliases:
      - manager approval on line
      - line approval
      - manager approval on whatsapp
      - whatsapp approval
    quantity:
      mode: fixed_package
      unit: approval package
      minimum: 1
      maximum: 1
    pricing:
      type: fixed
      amount_usd: 750
    timeline:
      base_days: 2
      parallelizable: false
    dependencies:
      - line_notifications
    included:
      - approve/reject action
      - authorized manager flow
    excluded:
      - complex multi-step approval matrix
    scope_rules:
      material_if_added: true
